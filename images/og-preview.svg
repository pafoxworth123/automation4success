<?xml version="1.0" encoding="utf-8"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="grad" x1="0" x2="1">
      <stop offset="0" stop-color="#1f7bf2"/>
      <stop offset="1" stop-color="#ff7a18"/>
    </linearGradient>
    <style>
      .title { font-family: Inter, Arial, sans-serif; font-weight: 700; font-size: 42px; fill: #0f1724; }
      .sub { font-family: Inter, Arial, sans-serif; font-weight: 400; font-size: 20px; fill: #334155; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#fff"/>

  <!-- left illustration block -->
  <rect x="40" y="40" width="540" height="550" rx="20" fill="#f6f9ff" stroke="#eef4ff"/>
  <g transform="translate(80,120)">
    <!-- stylized phone + document -->
    <rect x="30" y="20" width="220" height="360" rx="14" fill="#fff" stroke="#e6eefc"/>
    <rect x="86" y="46" width="88" height="6" rx="3" fill="#f1f5ff"/>
    <rect x="54" y="90" width="160" height="18" rx="6" fill="#e9f0ff"/>
    <rect x="54" y="122" width="160" height="12" rx="6" fill="#f8fbff"/>
  </g>

  <!-- right text area -->
  <g transform="translate(620,140)">
    <text class="title">Never miss a customer again</text>
    <text x="0" y="70" class="sub">Your friendly automated receptionist — answers calls, books appointments, and captures leads.</text>

    <!-- small badge -->
    <rect x="0" y="120" width="260" height="56" rx="12" fill="url(#grad)"/>
    <text x="28" y="156" font-family="Inter, Arial, sans-serif" font-size="18" fill="#fff" font-weight="700">Automation4Success.com</text>
  </g>

  <!-- small footer phone -->
  <text x="40" y="600" font-family="Inter, Arial, sans-serif" font-size="16" fill="#6b7280">Call: (972) 850-8399 • info@automation4success.com</text>
</svg>
