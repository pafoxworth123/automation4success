<?xml version="1.0" encoding="utf-8"?>
<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0" stop-color="#fffefc"/>
      <stop offset="1" stop-color="#f6f8fb"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" x2="1">
      <stop offset="0" stop-color="#e6f0ff"/>
      <stop offset="1" stop-color="#fff0ea"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="800" fill="url(#g1)"/>

  <!-- street -->
  <rect y="620" width="1200" height="180" fill="#efefef"/>

  <!-- shop base -->
  <g transform="translate(150,160)">
    <rect width="900" height="420" rx="18" fill="#ffffff" stroke="#e6e9ee"/>
    <!-- large window -->
    <rect x="60" y="60" width="500" height="260" rx="6" fill="#f8fbff" stroke="#e1e7f5" filter="url(#s)"/>
    <!-- door -->
    <rect x="620" y="110" width="150" height="210" rx="6" fill="#fff" stroke="#dfe7f3"/>
    <rect x="640" y="160" width="18" height="18" rx="4" fill="#1f7bf2"/>
    <!-- awning -->
    <g transform="translate(0,-40)">
      <rect x="0" y="0" width="900" height="60" rx="8" fill="url(#g2)"/>
      <g fill="#ffffff" opacity="0.95">
        <rect x="24" y="12" width="140" height="8" rx="4"/>
        <rect x="192" y="12" width="140" height="8" rx="4"/>
        <rect x="360" y="12" width="140" height="8" rx="4"/>
        <rect x="528" y="12" width="140" height="8" rx="4"/>
        <rect x="696" y="12" width="140" height="8" rx="4"/>
      </g>
    </g>

    <!-- potted plants -->
    <g fill="#dff3e8">
      <rect x="40" y="340" width="60" height="40" rx="8" fill="#dff3e8"/>
      <rect x="780" y="340" width="60" height="40" rx="8" fill="#dff3e8"/>
    </g>

    <!-- sign -->
    <g transform="translate(60, -10)">
      <rect x="0" y="0" rx="6" width="220" height="42" fill="#1f7bf2"/>
      <text x="18" y="28" font-family="Inter, Arial, sans-serif" font-size="18" fill="#fff" font-weight="700">Open</text>
    </g>
  </g>

  <!-- foreground shadow -->
  <ellipse cx="600" cy="640" rx="360" ry="36" fill="#000" opacity="0.05"/>
</svg>
